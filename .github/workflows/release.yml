name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Validate release tag
        env:
          IS_TAG: ${{ github.ref_type == 'tag' || github.event_name == 'release' }}
        run: |
          if [[ "$IS_TAG" != true || "$TAG" != v* ]]; then
            echo 'Select a v* tag when running this workflow.' >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and archive binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="images-mcp-${os}-${arch}"
            binary="$name"
            if [[ "$os" == windows ]]; then
              binary="${name}.exe"
            fi
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/$binary" .
            if [[ "$os" == windows ]]; then
              (cd dist && zip "${name}.zip" "$binary")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "$binary"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --generate-notes --verify-tag
          fi
