# images-mcp 配置文件
# 文档与说明参考: https://github.com/azicen/images-mcp

# 全局输出格式：file（仅文件）| base64（纯内存，零落盘）| both（文件与 Base64）
# 优先级：顶层 output_format > default.output_format > IMAGE_OUTPUT_FORMAT > file
output_format: file

# 默认模型：当请求未传入 model 或为空时使用
default_model: gemini-3.1-flash-image

# 整个生成请求的全局超时，支持 Go duration 或纯秒数字符串
timeout: 10m

# 图像保存输出目录：留空时优先读取 IMAGE_OUTPUT_DIR 环境变量，未设置则使用系统临时目录
output_dir: ""

# 全局默认中转服务地址与 API Key（按需修改）
default:
  base_url: https://relay.example/v1
  api_key: your-default-api-key

# 精确模型配置与路由说明（会被 list_models 返回并用于智能体提示）
# api 可选:
#   - chat (Gemini 聊天补全路由, 支持文生图与基于 input_images 的多模态图生图)
#   - images (GPT Image 路由, 支持文生图与 multipart 图生图/编辑)
models:
  gemini-3.1-flash-image:
    api: chat
    description: 速度快成本低，擅长文字渲染、多图融合与角色一致。
    notes: 极速高性价比；画面排版与文字渲染精准；擅长多图融合与保持角色一致。

  gpt-image-2.5-flare:
    api: images
    description: 极速日常首选，生成快画质高，局部修改精准不走样。
    notes: 速度与画质兼备；局部修图（换衣服、改背景等）对原主体和构图保留最忠实。

  gpt-image-2.5-sunburst:
    api: images
    timeout: 15m  # 适合耗时长的高精度精修
    description: 细节与光影最强，适合高精终稿与复杂精修。
    notes: 微观细节与光影质感最强，多轮连续修改控制力最高；单次耗时稍长。

  gpt-image-2.5:
    api: images
    description: 标准通用款，光影自然，支持透明背景。
    notes: 质感自然无塑料感，支持透明背景与常规图文编辑。

  gpt-image-2:
    api: images
    description: 出图快成本低，适合大批量草稿与缩略图。
    notes: 成本低，适合初期灵感探索与大批量出草图。

families:
  gemini:
    base_url: https://gemini-relay.example/v1
    api_key: your-gemini-api-key
  gpt-image:
    base_url: https://gpt-image-relay.example/v1
    api_key: your-gpt-image-api-key

# 传输配置（默认 stdio）；HTTP 通过 /mcp 接入，/healthz 无需鉴权
server:
  transport: stdio # stdio | http；-http 地址 可覆盖为 HTTP
  listen: "127.0.0.1:8080" # HTTP 监听地址；MCP_LISTEN 回退
  api_key: "" # HTTP 服务访问密钥，与中转 API Key 分开；建议通过 MCP_SERVER_KEY 注入
  enable_sse: false # 可选旧版 SSE /sse，会话 POST 同样需要鉴权

# HTTP + file/both 强制配置 S3；stdio 或 base64 忽略此块
# 必须填写真实 bucket、完整静态凭据；不会自动建桶或验证远端权限
s3:
  endpoint: "" # MinIO/RustFS: https://storage.example；R2: https://<account>.r2.cloudflarestorage.com；AWS 可空
  bucket: "" # S3_BUCKET
  region: "us-east-1" # R2 使用 auto；S3_REGION / AWS_REGION 回退
  access_key_id: "" # AWS_ACCESS_KEY_ID 回退
  secret_access_key: "" # AWS_SECRET_ACCESS_KEY 回退
  session_token: "" # 可选临时凭据 AWS_SESSION_TOKEN
  use_path_style: true # MinIO/RustFS 通常为 true；R2/AWS 按提供商要求设置
  key_prefix: images # 对象键: images/YYYY/MM/DD/<随机十六进制>.<扩展名>
  public_url_prefix: "" # 可选公开桶/CDN 前缀，需由用户配置公开访问；S3_PUBLIC_URL_PREFIX 回退
  presign_ttl: 24h # 无公开前缀时签发 GET URL；正数 Go duration，最长 168h
# endpoint 回退: S3_ENDPOINT / AWS_ENDPOINT_URL_S3
# use_path_style 未配置时回退 S3_USE_PATH_STYLE (true/false)
