mode: standalone # standalone | server | forward；默认 standalone

# images-mcp 配置文件
# 文档与说明参考: https://github.com/azicen/images-mcp

# standalone / forward 的本机输出格式：file（仅文件）| base64（纯内存，零落盘）| both（文件与 Base64）
# 优先级：顶层 output_format > default.output_format > IMAGE_OUTPUT_FORMAT > file
# server 成功图片响应恒定为 multipart/mixed 原始字节，忽略 output_format；forward 按本机设置输出。
output_format: file

# 默认模型：当请求未传入 model 或为空时使用
default_model: gemini-3.1-flash-image

# 整个生成请求的全局超时，支持 Go duration 或纯秒数字符串
timeout: 10m

# standalone 和 forward 本机图像保存目录：留空时优先读取 IMAGE_OUTPUT_DIR 环境变量，未设置则使用系统临时目录
output_dir: ""

# 全局默认中转服务地址与 API Key（按需修改）
default:
  base_url: "" # OPENAI_BASE_URL
  api_key: "" # OPENAI_API_KEY

# 精确模型配置与路由说明（会被 list_models 返回并用于智能体提示）
# api 可选:
#   - chat (Gemini 聊天补全路由, 支持文生图与基于 input_images 的多模态图生图)
#   - images (GPT Image 路由, 支持文生图与 multipart 图生图/编辑)
models:
  gemini-3.1-flash-image:
    tags: [fast, cost-effective, text-rendering, multi-image, consistency]
    api: chat
    description: 速度快成本低，擅长文字渲染、多图融合与角色一致。
    notes: 极速高性价比；画面排版与文字渲染精准；擅长多图融合与保持角色一致。

  gpt-image-2.5-flare:
    sizes: [1024x1024, 1536x1024, 1024x1536, 1536x864, 864x1536, auto]
    default_size: 1024x1024
    supports_custom_size: true
    qualities: [low, medium, high]
    default_quality: medium
    tags: [fast, high-quality, editing, subject-preservation]
    api: images
    description: 极速日常首选，生成快画质高，局部修改精准不走样。
    notes: 速度与画质兼备；局部修图（换衣服、改背景等）对原主体和构图保留最忠实。

  gpt-image-2.5-sunburst:
    sizes: [1024x1024, 1536x1024, 1024x1536, 1536x864, 864x1536, auto]
    default_size: 1024x1024
    supports_custom_size: true
    qualities: [medium, high]
    default_quality: high
    tags: [high-detail, photorealistic, fine-tuning, slow]
    api: images
    timeout: 15m  # 适合耗时长的高精度精修
    description: 细节与光影最强，适合高精终稿与复杂精修。
    notes: 微观细节与光影质感最强，多轮连续修改控制力最高；单次耗时稍长。

  gpt-image-2.5:
    sizes: [1024x1024, 1536x1024, 1024x1536, 1536x864, 864x1536, auto]
    default_size: 1024x1024
    supports_custom_size: true
    qualities: [low, medium, high]
    default_quality: medium
    tags: [balanced, natural-lighting, transparent-background, editing]
    api: images
    description: 标准通用款，光影自然，支持透明背景。
    notes: 质感自然无塑料感，支持透明背景与常规图文编辑。

  gpt-image-2:
    sizes: [1024x1024, 1536x1024, 1024x1536, auto]
    default_size: 1024x1024
    supports_custom_size: true
    qualities: [low, medium]
    default_quality: low
    tags: [fast, budget, draft, thumbnail]
    api: images
    description: 出图快成本低，适合大批量草稿与缩略图。
    notes: 成本低，适合初期灵感探索与大批量出草图。

# 如需按家族覆盖，可添加 families；不要保留占位凭据遮蔽 default。
server:
  listen: ":8080" # MCP_LISTEN
  api_key: "" # MCP_SERVER_KEY / SERVER_API_KEY，与中转密钥独立

# forward 不需要 models/default，仅在本地提供 stdio MCP。
forward:
  url: "" # IMAGES_MCP_FORWARD_URL，例如 https://images.example.com/prefix
  api_key: "" # IMAGES_MCP_FORWARD_KEY / FORWARD_KEY / MCP_FORWARD_KEY
  timeout: 15m # IMAGES_MCP_FORWARD_TIMEOUT；CLI > 文件 > 环境 > 默认
