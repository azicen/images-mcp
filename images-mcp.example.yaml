# Copy to images-mcp.yaml, replace the placeholder endpoints and keys, then start
# images-mcp in that directory or pass -config /absolute/path/to/images-mcp.yaml.
# Model availability and supported options depend on your relay.
default_model: gemini-3.1-flash-image

# An empty string uses IMAGE_OUTPUT_DIR if set, otherwise the system temporary
# directory (os.TempDir()). Relative paths resolve from the working directory.
output_dir: ""

# Shared credentials used when no higher-priority override supplies a field.
default:
  base_url: https://relay.example/v1
  api_key: your-default-api-key

# Exact, case-sensitive model IDs exposed by list_models.
# api selects the route: chat (chat completions) or images (generation/edits).
# api_type is an optional alias for api; if both are set, they must agree.
# description is a short summary; notes provides detailed usage guidance.
models:
  gemini-3.1-flash-image:
    api: chat
    description: Image generation and editing through Gemini chat completions.
    notes: |
      Supply input_images to edit: first is primary, later images are style/context references.
      Legacy input_image is prepended; blank entries are ignored.
      Up to 16 PNG/JPEG/WebP inputs, 32 MiB each and 64 MiB total.
      The chat route does not accept size or quality arguments.

  gpt-image-2.5-flare:
    api: images
    description: Image generation and editing through the Images API.
    notes: |
      Supply input_images (or legacy input_image) for multipart image edits.
      First combined image is primary; remaining images are style/context references.
      Up to 16 PNG/JPEG/WebP inputs, 32 MiB each and 64 MiB total.
      Use size and quality only with values supported by your relay.

  custom-nano-draw:
    # Custom names require an explicit API because their prefix is unrecognized.
    api: chat
    description: Custom image model served by a dedicated compatible relay.
    notes: |
      Replace this ID with the exact model name accepted by your relay.
      This chat model uses the gemini credential family unless overridden here.
    base_url: https://custom-relay.example/v1
    api_key: your-custom-model-api-key

# Family credentials are fallbacks for models without per-model overrides.
# Each field resolves independently: request > model > file family > family
# environment > file default > OPENAI environment. Empty credentials fall through.
# Explicit API selection determines the family: chat -> gemini, images -> gpt-image.
families:
  gemini:
    base_url: https://gemini-relay.example/v1
    api_key: your-gemini-api-key
  gpt-image:
    base_url: https://gpt-image-relay.example/v1
    api_key: your-gpt-image-api-key
